[project]
name = "matplotlib-prefab"
version = "0.2.0.dev0"
description = "Agent-facing skill for rendering publication-style single-column matplotlib figures."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pypdf>=4.0",
]
# Building and verifying the browser style lab under web/. Not needed to render a
# figure, and not needed by anyone opening the published site.
web = [
    "pytest>=7.0",
    "pypdf>=4.0",
    "playwright>=1.40",   # drives the browser for the calibration and the web tests
    "pillow>=10.0",       # compares page rasters
    "fonttools>=4.50",    # packages the venue body faces and reads embedded Type 1
    "brotli>=1.1",        # WOFF2 compression, via fonttools
]

# Not published to PyPI: the skill is used by copying or referencing
# skills/scientific-figures/, not by installing a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Glyph .* missing from font:UserWarning",
    "ignore:constrained_layout not applied:UserWarning",
]
markers = [
    "conference_context: compiles a conference template with LaTeX and rasterises the page. Needs latexmk, pdflatex, bibtex and pdftoppm; skipped without them. Run just these with `-m conference_context`.",
    "web: exercises the browser style lab. Needs the fetched Pyodide runtime, the packaged fonts and a Playwright browser; skipped with a message naming the missing command. Run just these with `python -m pytest tests/web`.",
]
